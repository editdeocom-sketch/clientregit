appId: com.clientregit.desktop
productName: ClientRegit
copyright: Copyright © 2026 ClientRegit

directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - package.json

asarUnpack:
  - node_modules/better-sqlite3/**/*

npmRebuild: false
nodeGypRebuild: false

publish:
  provider: github
  owner: editdeocom-sketch
  repo: clientregit
  releaseType: release

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ClientRegit
  artifactName: ClientRegit-Setup.exe

portable:
  artifactName: ClientRegit-Portable.exe

mac:
  icon: build/icon.png
  identity: null
  category: public.app-category.business
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

dmg:
  artifactName: ClientRegit.dmg
